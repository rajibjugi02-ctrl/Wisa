name: Release Wisa for Windows

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: npm install

      - name: Build React / Vite frontend
        run: npm run build

      - name: Compile True Wisa Desktop App with Tauri v2
        run: npx @tauri-apps/cli build

      - name: Stage Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release-dist" -Force
          $nsisExe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($nsisExe) {
            Copy-Item $nsisExe.FullName "release-dist/Wisa-Setup.exe" -Force
          }
          $msiFile = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if ($msiFile) {
            Copy-Item $msiFile.FullName "release-dist/Wisa.msi" -Force
          }
          $rawExe = "src-tauri/target/release/wisa-notch.exe"
          if (Test-Path $rawExe) {
            tar -acf "release-dist/Wisa-portable.zip" -C "src-tauri/target/release" "wisa-notch.exe"
          }
          Get-ChildItem "release-dist"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.2.0
          name: "Wisa v1.2.0 — True Windows Desktop Release"
          body: |
            ## Wisa 1.2.0 for Windows 10 & 11 (64-bit)
            
            Built 100% from genuine React/TypeScript source code by Rajib.

            ### ✨ Key Features:
            - **Original Wisa Notch**: Sleek VisionOS glassmorphism with top-center scaling.
            - **8 Clean Settings Tabs**: General, Music and lyrics, Timer & Pomodoro, To-do, Prayer, Shelf, AI Assistant, About (Zero PRO locks).
            - **6 Bottom Capsule Dock Tabs**: Music, Timer, Shelf, To-do, Prayer, AI Assistant.
            - **Real SMTC & Synced Lyrics**: Spotify, Apple Music & LRCLIB integration.
            - **Live AI Assistant**: Real token streaming from Google Gemini & OpenAI.
            - **Single-Instance Protection**: Prevents multiple processes running simultaneously.
            - **System Tray & Quit Button**: Close anytime directly from tray or Settings.

            ### 📦 Downloads:
            - **Installer**: `Wisa-Setup.exe` / `Wisa.msi`
            - **Portable**: `Wisa-portable.zip`
          files: release-dist/*
          draft: false
          prerelease: false
